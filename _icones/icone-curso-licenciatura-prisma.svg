<?xml version="1.0" encoding="UTF-8"?>
<!--
  icone-curso-licenciatura-prisma.svg
  Icone do CURSO de Licenciatura em Fisica — IFMG Campus Ouro Preto.
  Briefing: _planejamento/_pre/PRE-icone-curso-licenciatura-2026-09-11.md (aprovado).

  Par de pecas no topo do indice, como na FC1/FE1: a marca da disciplina (atomo+regua, ILB)
  + o icone do curso (aqui; na Mineracao e a vagoneta). Medalhao escuro com aro verde-quadro
  #3E8E5A; o prisma decompoe um feixe branco no espectro completo. Sem texto.
  PNG 200 px do site: gerado deste arquivo (_publicacao/ilb-oa/_icones/icon-prisma.png).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Prisma decompondo a luz — Licenciatura em Física">
  <title>Prisma decompondo a luz — Licenciatura em Física</title>
  <defs>
    <radialGradient id="fundo" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#26302B"/>
      <stop offset="1" stop-color="#0E1411"/>
    </radialGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F2F8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7FB2D6" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="dentro"><circle cx="100" cy="100" r="86"/></clipPath>
  </defs>

  <!-- medalhao: fundo, aro verde-quadro e anel pontilhado (familia da vagoneta) -->
  <circle cx="100" cy="100" r="96" fill="url(#fundo)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#3E8E5A" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#3E8E5A" stroke-width="1"
          stroke-dasharray="1.5 3" opacity="0.8"/>

  <g clip-path="url(#dentro)">
    <!-- feixe branco incidente -->
    <polygon points="12,116 12,110 79,88 80,92" fill="#FFFFFF" opacity="0.95"/>
    <!-- trajeto dentro do vidro -->
    <polygon points="79,88 80,92 121,95 119,86" fill="#FFFFFF" opacity="0.35"/>
    <!-- espectro: vermelho desvia menos (em cima), violeta mais (embaixo) -->
    <polygon points="119,86 120.1,88 190,92 190,82"   fill="#E53935"/>
    <polygon points="120.1,88 120.9,89.5 190,102 190,92" fill="#FB8C00"/>
    <polygon points="120.9,89.5 121.7,91 190,112 190,102" fill="#FDD835"/>
    <polygon points="121.7,91 122.5,92.4 190,122 190,112" fill="#43A047"/>
    <polygon points="122.5,92.4 123.3,93.8 190,132 190,122" fill="#1E88E5"/>
    <polygon points="123.3,93.8 124.1,95.2 190,142 190,132" fill="#3949AB"/>
    <polygon points="124.1,95.2 125,97 190,152 190,142" fill="#8E24AA"/>
  </g>

  <!-- prisma de vidro -->
  <polygon points="100,50 56,130 144,130" fill="url(#vidro)" stroke="#DDEBF3"
           stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="100" y1="54" x2="64" y2="121" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>

  <!-- bancada: traco azul-aco sob o prisma -->
  <line x1="50" y1="138" x2="150" y2="138" stroke="#7FB2D6" stroke-width="3" stroke-linecap="round"/>

  <!-- brilhos discretos -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="46" cy="62" r="1.2"/>
    <circle cx="150" cy="56" r="1"/>
    <circle cx="70" cy="160" r="1"/>
    <circle cx="140" cy="164" r="1.2"/>
  </g>
</svg>
